[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lingjing-solo"
version = "0.1.0"
description = "Lingjing-Solo single-agent world-model framework for interactive reasoning benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [{ name = "LingJing1001" }]
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
cnn = [
  "torch>=2.2",
]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["lingjing_solo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
